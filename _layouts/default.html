<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ page.author | default: site.author }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/SP - Logo - 500x500.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/SP - Logo - 500x500.png' | relative_url }}">
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  
  <!-- SEO and Social Media Tags -->
  {% seo %}

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JXQM9QTSGB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JXQM9QTSGB');
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <div class="nav-brand">
        <a href="/">
          <img src="/assets/images/SP - Logo - 500x500.png" alt="Simply Productive Logo" class="logo">
          <span class="brand-text">Simply Productive</span>
        </a>
      </div>
      <div class="nav-menu">
        <a href="/" class="nav-link {% if page.title == 'Home' %}active{% endif %}">Home</a>
        <a href="/#services" class="nav-link">Examples</a>
        <a href="/about" class="nav-link {% if page.title == 'About' %}active{% endif %}">About</a>
        <a href="/contact" class="nav-link {% if page.title == 'Contact' %}active{% endif %}">Contact</a>
        <a href="{{ site.calendly }}" class="button-link primary nav-cta" target="_blank" rel="noopener">Book a free call</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>
  <main class="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p class="footer-links">
      <a href="{{ site.calendly }}" target="_blank" rel="noopener">
        <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Book a free call
      </a>
      <a href="mailto:{{ site.email }}">
        <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>{{ site.email }}
      </a>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener">
        <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>LinkedIn
      </a>
    </p>
    <p>&copy; {{ site.time | date: '%Y' }} Simply Productive. All rights reserved.</p>
  </footer>

  <script>
    // Mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      const navToggle = document.querySelector('.nav-toggle');
      const navMenu = document.querySelector('.nav-menu');
      
      if (navToggle && navMenu) {
        navToggle.addEventListener('click', function() {
          navMenu.classList.toggle('active');
          navToggle.classList.toggle('active');
        });

        // Close menu when clicking on a link
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', function() {
            navMenu.classList.remove('active');
            navToggle.classList.remove('active');
          });
        });
      }

      // Contact form enhancements
      const contactForm = document.querySelector('.contact-form');
      if (contactForm) {
        // Add form validation feedback
        const inputs = contactForm.querySelectorAll('input[required], select[required], textarea[required]');
        inputs.forEach(input => {
          input.addEventListener('blur', function() {
            if (this.value.trim() === '') {
              this.style.borderColor = '#ef4444';
            } else {
              this.style.borderColor = '#10b981';
            }
          });

          input.addEventListener('focus', function() {
            this.style.borderColor = '#3b82f6';
          });
        });

        // Show a sending state; the form submits normally to its action URL
        contactForm.addEventListener('submit', function() {
          const submitButton = this.querySelector('.submit-button');
          if (submitButton) {
            submitButton.textContent = 'Sending...';
            submitButton.disabled = true;
          }
        });
      }

      // Smooth scrolling for anchor links
      const anchorLinks = document.querySelectorAll('a[href^="#"]');
      anchorLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          const href = this.getAttribute('href');
          if (href === '#') return;
          
          const target = document.querySelector(href);
          if (target) {
            e.preventDefault();
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });
      });
    });
  </script>
</body>
</html>
