# Site Information
title: Simply Productive
tagline: "AI Automation for Businesses, Nonprofits & Solopreneurs"
description: "Practical AI automations and tech help for small and mid-sized businesses, nonprofits, and solopreneurs. Simple tools that take the busywork off your plate."
long_description: "Simply Productive helps small and mid-sized businesses, nonprofits, and solopreneurs save time with simple AI automations, workflow setup, and everyday tech help, explained in plain English and built around how you already work."

# URLs
baseurl: "" # if deploying to root domain
url: "https://getsimplyproductive.com"

# SEO and Social
author: "Dan Bough"
logo: "/assets/images/SP - Logo - 500x500.png"
social:
  name: Simply Productive
  links:
    - https://www.linkedin.com/in/dan-bough/

# Contact Information
email: hello@getsimplyproductive.com
calendly: "https://calendly.com/danbough/simply-productive-consult"
linkedin: "https://www.linkedin.com/in/dan-bough/"
# Intake form: create a free form at formspree.io and paste its ID (e.g. "xyzabcd").
# Leave blank to hide the form and show Calendly/email instead.
formspree_id: "mljjadgo"

# Business Information
business_hours: "Monday-Friday, 9 AM - 5 PM EST"
founded_year: 2024
company_type: "AI & Tech Consulting"

# SEO Settings
lang: en_US
timezone: America/New_York
google_analytics: # Add GA tracking ID when available
google_site_verification: # Add Google Search Console verification when available

# Post URLs (kept so old article links still work if Learn returns)
permalink: /learn/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "Dan Bough"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Dan Bough"
      show_excerpts: true

# Plugin Configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Feed Settings
feed:
  excerpt_only: true
  
# Sitemap Settings
sitemap:
  exclude:
    - "/admin/"
    - "/drafts/"

# Build Settings
markdown: kramdown
highlighter: rouge
incremental: false
safe: true

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - package.json
  - package-lock.json
  - webpack.config.js
  # Hidden for now (products/learn/youtube); remove these lines to bring them back
  - learn.md
  - youtube.md
  - _posts/
